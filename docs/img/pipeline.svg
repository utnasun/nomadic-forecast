<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="PT Sans, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <style>
      .b{fill:#eef4fc;stroke:#2c6fc9;stroke-width:1.4;rx:7}
      .s{fill:#fdf1e6;stroke:#d9822b;stroke-width:1.4;rx:7}
      .d{fill:#f2f4f7;stroke:#8a93a0;stroke-width:1.4;rx:7}
      .t{font-size:14px;font-weight:700;fill:#1d1d1f}
      .x{font-size:12px;fill:#3c4350}
      .h{font-size:13px;font-weight:700;letter-spacing:.5px}
      .l{stroke:#5b6472;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <text x="20" y="22" class="h" fill="#2c6fc9">ПРОГНОЗ</text>
  <text x="20" y="252" class="h" fill="#d9822b">ДЕТЕКТОР ШОКОВ</text>

  <!-- данные -->
  <rect class="d" x="20" y="34" width="160" height="150"/>
  <text x="32" y="58" class="t">Данные</text>
  <text x="32" y="80" class="x">расходы 2016 МО,</text>
  <text x="32" y="96" class="x">6 категорий, 24 мес.</text>
  <text x="32" y="120" class="x">+ справочник МО,</text>
  <text x="32" y="136" class="x">население, дороги</text>
  <text x="32" y="152" class="x">до соседей,</text>
  <text x="32" y="168" class="x">доступность рынков</text>

  <!-- признаки -->
  <rect class="b" x="210" y="34" width="160" height="150"/>
  <text x="222" y="58" class="t">Признаки</text>
  <text x="222" y="80" class="x">только по месяцам</text>
  <text x="222" y="96" class="x">до прогнозного:</text>
  <text x="222" y="120" class="x">приросты, уровень,</text>
  <text x="222" y="136" class="x">месяц года, год назад,</text>
  <text x="222" y="152" class="x">регион и соседи,</text>
  <text x="222" y="168" class="x">вся панель</text>

  <!-- правило -->
  <rect class="b" x="400" y="34" width="170" height="150"/>
  <text x="412" y="58" class="t">Правило выбора</text>
  <text x="412" y="80" class="x">R² общего месяца</text>
  <text x="412" y="96" class="x">по 2023 г.:</text>
  <text x="412" y="120" class="x">≥ 0,5 → сезонность</text>
  <text x="412" y="136" class="x">общая → версия А</text>
  <text x="412" y="160" class="x">&lt; 0,5 → у каждого МО</text>
  <text x="412" y="176" class="x">своя → версия Б</text>

  <!-- версии -->
  <rect class="b" x="600" y="34" width="190" height="68"/>
  <text x="612" y="56" class="t">CatBoost, версия А</text>
  <text x="612" y="76" class="x">ряд очищен сезонным</text>
  <text x="612" y="92" class="x">профилем, прирост в log</text>
  <rect class="b" x="600" y="116" width="190" height="68"/>
  <text x="612" y="138" class="t">CatBoost, версия Б</text>
  <text x="612" y="158" class="x">без поправки,</text>
  <text x="612" y="174" class="x">прирост в рублях</text>

  <!-- прогноз -->
  <rect class="b" x="820" y="34" width="160" height="150"/>
  <text x="832" y="58" class="t">Прогноз</text>
  <text x="832" y="80" class="x">рекурсивно</text>
  <text x="832" y="96" class="x">на 1–12 месяцев</text>
  <text x="832" y="120" class="x">+ 90%-интервал</text>
  <text x="832" y="136" class="x">по квантилям</text>
  <text x="832" y="152" class="x">прошлых ошибок</text>

  <path class="l" d="M180,109 H206"/>
  <path class="l" d="M370,109 H396"/>
  <path class="l" d="M570,90 L596,72"/>
  <path class="l" d="M570,128 L596,148"/>
  <path class="l" d="M790,68 L816,95"/>
  <path class="l" d="M790,150 L816,123"/>

  <!-- детектор -->
  <rect class="s" x="20" y="264" width="160" height="116"/>
  <text x="32" y="288" class="t">Неожиданность</text>
  <text x="32" y="310" class="x">log(факт / прогноз</text>
  <text x="32" y="326" class="x">на 1 мес.) по каждой</text>
  <text x="32" y="342" class="x">из 6 категорий</text>

  <rect class="s" x="210" y="264" width="160" height="116"/>
  <text x="222" y="288" class="t">Нормировка</text>
  <text x="222" y="310" class="x">на обычный разброс</text>
  <text x="222" y="326" class="x">похожих МО и</text>
  <text x="222" y="342" class="x">самого МО</text>

  <rect class="s" x="400" y="264" width="170" height="116"/>
  <text x="412" y="288" class="t">Регион или МО</text>
  <text x="412" y="310" class="x">медиана по региону —</text>
  <text x="412" y="326" class="x">региональный шок,</text>
  <text x="412" y="342" class="x">остаток — местный</text>

  <rect class="s" x="600" y="264" width="190" height="116"/>
  <text x="612" y="288" class="t">Одна оценка (combo)</text>
  <text x="612" y="310" class="x">max из topk и</text>
  <text x="612" y="326" class="x">расстояния Махаланобиса</text>
  <text x="612" y="342" class="x">в процентилях</text>

  <rect class="s" x="820" y="264" width="160" height="116"/>
  <text x="832" y="288" class="t">Решение</text>
  <text x="832" y="310" class="x">верхний 1% — шок,</text>
  <text x="832" y="326" class="x">следующие 2% —</text>
  <text x="832" y="342" class="x">«внимание»; тип шока</text>
  <text x="832" y="358" class="x">через месяц</text>

  <path class="l" d="M180,322 H206"/>
  <path class="l" d="M370,322 H396"/>
  <path class="l" d="M570,322 H596"/>
  <path class="l" d="M790,322 H816"/>

  <!-- связи между блоками -->
  <path class="l" d="M900,184 V214 H100 V260" stroke-dasharray="5 4"/>
  <text x="300" y="208" class="x">прогноз на 1 мес. — ожидаемое значение для детектора</text>
  <path class="l" d="M940,264 V196" stroke-dasharray="5 4"/>
  <text x="948" y="236" class="x" text-anchor="start">шок →</text>
  <text x="948" y="250" class="x">×1,3</text>
</svg>

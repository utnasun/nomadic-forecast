# Прогнозы на 1 месяц с июля 2023 г. (обучение от 6 месяцев) — только для истории шоков (src.shocks_v2 --early).
# Собран из configs/forecast.yaml: протокол min_train 6, горизонт 1, модели правила final.
# Запуск: .venv/bin/python -m src.run_forecast --config configs/early.yaml
seed: 42
data:
  consumption: consumption.parquet
  market_access: market_access.parquet
  external:
    static: data/external/territory_static.parquet
    quarterly: data/external/rosstat_quarterly.parquet
    connection: connection.parquet
    n_neighbors: 5
    rosstat_lag_months: 6
    news: data/news/city_month.parquet
    region_monthly: data/external/region_monthly.parquet
    macro_lag_months:
      cpi: 1
      wage: 3
  seasonal:
    national: data/external/national_monthly.parquet
    years:
    - 2019
    - 2022
    profiles:
      Все категории: Всего
      Продовольствие: Продовольственные товары
      Здоровье: Непродовольственные товары
      Общественное питание: Непродовольственные товары
      Транспорт: Услуги
      Маркетплейсы: null
  only_complete: true
  categories:
  - Все категории
  - Продовольствие
  - Здоровье
  - Маркетплейсы
  - Общественное питание
  - Транспорт
protocol:
  min_train: 6
  horizons:
  - 1
metrics:
- MAE
- RMSE
- WAPE
- MAPE
- sMAPE
- ME
- R2
- R2_growth
models:
  naive:
    enabled: false
  mean_3:
    enabled: false
    window: 3
  mean_6:
    enabled: false
    window: 6
  mean_12:
    enabled: false
    window: 12
  drift:
    enabled: false
  seasonal_naive:
    enabled: false
  seasonal_naive_growth:
    enabled: false
    growth_window: 3
  auto_ets:
    enabled: false
  auto_theta:
    enabled: false
  auto_arima:
    enabled: false
  prophet_default:
    enabled: false
    params: {}
  prophet_yearly:
    enabled: false
    params:
      yearly_seasonality: 3
      seasonality_prior_scale: 1.0
  catboost_logdiff:
    enabled: false
    kind: catboost
    target: log_diff
    params:
      iterations: 500
      depth: 6
      learning_rate: 0.05
      loss_function: RMSE
  catboost_diff:
    enabled: true
    kind: catboost
    target: diff
    params:
      iterations: 500
      depth: 6
      learning_rate: 0.05
      loss_function: RMSE
  ridge_logdiff:
    enabled: false
